name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull request runs only; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifests:
    name: manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # the catalogue guards resolve the release tags
      - name: Validate plugin manifests
        run: scripts/validate-plugins.sh
      - name: The pin audit fails closed
        run: scripts/test-catalogue-guards.sh

  catalogue:
    name: catalogue
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # the generator resolves each release tag to its commit (sha)
      - name: Committed catalogue matches the generator
        run: scripts/build-catalogue.sh --check
      - name: Legacy-mode catalogue still generates and parses
        run: |
          scripts/build-catalogue.sh --mode legacy --out "$RUNNER_TEMP/legacy.json"
          jq -e '.plugins | length > 0' "$RUNNER_TEMP/legacy.json"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: shellcheck
        run: find scripts plugins -name '*.sh' -print0 | xargs -0 shellcheck
      - name: JSON files parse
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 jq -e . >/dev/null

  # Runs the real manifest parser and composer (app/core in albitor-ltd/albitor) over the schema-2
  # plugins, then builds the composed web tree. Needs read access to the private albitor
  # repository through the ALBITOR_REPO_TOKEN secret. Only a pull request from a fork skips (a
  # fork gets no secrets, and the skip is annotated); on any other run a missing token fails the
  # job, so it can never be a silent green.
  compose:
    name: compose
    runs-on: ubuntu-24.04
    env:
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      HAVE_TOKEN: ${{ secrets.ALBITOR_REPO_TOKEN != '' }}
    steps:
      - name: Skipped for a fork pull request
        if: env.IS_FORK == 'true'
        run: echo "::notice::compose skipped, fork pull requests get no ALBITOR_REPO_TOKEN; a maintainer must run scripts/compose-check.sh"
      - name: ALBITOR_REPO_TOKEN missing
        if: env.IS_FORK != 'true' && env.HAVE_TOKEN != 'true'
        run: |
          echo "::error::ALBITOR_REPO_TOKEN missing"
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.IS_FORK != 'true' && env.HAVE_TOKEN == 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.IS_FORK != 'true' && env.HAVE_TOKEN == 'true'
        with:
          persist-credentials: false
          repository: albitor-ltd/albitor
          token: ${{ secrets.ALBITOR_REPO_TOKEN }}
          path: albitor
          sparse-checkout: app/core
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: env.IS_FORK != 'true'
        with:
          go-version: "1.26"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.IS_FORK != 'true'
        with:
          node-version: "22"
      - name: Compose, check, test and build
        if: env.IS_FORK != 'true'
        run: scripts/compose-check.sh --build "$GITHUB_WORKSPACE/albitor"

  # The api-go plugin's own Go: its tree, composed with every slot empty, builds, vets and tests.
  api-go:
    name: api-go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Build, vet and test the composed API tree
        run: scripts/verify-api-go.sh

  # The data-dynamodb plugin's own Go, composed over api-go: build, vet, test, then the data-store@1
  # conformance suite against amazon/dynamodb-local (Docker is on the runner; the script starts and
  # removes the container).
  data-dynamodb:
    name: data-dynamodb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Build, vet and test the composed tree, then DynamoDB Local conformance
        run: scripts/verify-data-dynamodb.sh

  # Placeholder for the socket conformance and certification harness
  # (albitor-ltd/albitor#3164). Deliberately a no-op until that lands. It must NOT be a required
  # check until then: a required no-op reads as a passing gate while checking nothing.
  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    steps:
      - run: echo "conformance harness not wired yet (albitor-ltd/albitor#3164)"
