name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate plugin manifests
        run: scripts/validate-plugins.sh

  catalogue:
    name: catalogue
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Committed catalogue matches the generator
        run: scripts/build-catalogue.sh --check
      - name: Monorepo-mode catalogue generates and parses
        run: |
          scripts/build-catalogue.sh --mode monorepo --out "$RUNNER_TEMP/monorepo.json"
          jq -e '.plugins | length > 0' "$RUNNER_TEMP/monorepo.json"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck
        run: find scripts plugins -name '*.sh' -print0 | xargs -0 shellcheck
      - name: JSON files parse
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 jq -e . >/dev/null

  # Runs the real manifest parser and composer (app/core in albitor-ltd/albitor) over the schema-2
  # plugins, then builds the composed web tree. Needs read access to the private albitor
  # repository through the ALBITOR_REPO_TOKEN secret; without it the job reports that it did not
  # run, so check scripts/compose-check.sh locally before merging.
  compose:
    name: compose
    runs-on: ubuntu-24.04
    env:
      HAVE_TOKEN: ${{ secrets.ALBITOR_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Skipped without ALBITOR_REPO_TOKEN
        if: env.HAVE_TOKEN != 'true'
        run: echo "::warning::compose not run, ALBITOR_REPO_TOKEN is not set"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.HAVE_TOKEN == 'true'
        with:
          repository: albitor-ltd/albitor
          token: ${{ secrets.ALBITOR_REPO_TOKEN }}
          path: albitor
          sparse-checkout: app/core
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: env.HAVE_TOKEN == 'true'
        with:
          go-version: "1.26"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.HAVE_TOKEN == 'true'
        with:
          node-version: "22"
      - name: Compose, check, test and build
        if: env.HAVE_TOKEN == 'true'
        run: scripts/compose-check.sh --build "$GITHUB_WORKSPACE/albitor"

  # Placeholder for the socket conformance and certification harness
  # (albitor-ltd/albitor#3164). Deliberately a no-op until that lands; the job name is stable
  # so branch protection can require it now.
  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    steps:
      - run: echo "conformance harness not wired yet (albitor-ltd/albitor#3164)"
