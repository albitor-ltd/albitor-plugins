name: ci

on:
  pull_request:
  push:
    branches: [main]
    # Release tags (<plugin>/v<semver>) run the same jobs, certification included (albitor#3333).
    tags: ["*/v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull request runs only; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifests:
    name: manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the catalogue guards resolve the release tags
      - name: Validate plugin manifests
        run: scripts/validate-plugins.sh
      - name: The pin audit fails closed
        run: scripts/test-catalogue-guards.sh
      - name: Preview tokens match the platform contract
        run: scripts/validate-preview-tokens.sh
      - name: The preview-tokens validator refuses bad files
        run: scripts/test-preview-tokens.sh

  catalogue:
    name: catalogue
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the generator resolves each release tag to its commit (sha)
      - name: Committed catalogue matches the generator
        run: scripts/build-catalogue.sh --check
      - name: Legacy-mode catalogue still generates and parses
        run: |
          scripts/build-catalogue.sh --mode legacy --out "$RUNNER_TEMP/legacy.json"
          jq -e '.plugins | length > 0' "$RUNNER_TEMP/legacy.json"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: find scripts plugins -name '*.sh' -print0 | xargs -0 shellcheck
      - name: JSON files parse
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 jq -e . >/dev/null

  # Runs the real manifest parser and composer (app/core in albitor-ltd/albitor) over the schema-2
  # plugins, then builds the composed web tree. Needs read access to the private albitor
  # repository through the ALBITOR_REPO_TOKEN secret. Only a pull request from a fork skips (a
  # fork gets no secrets, and the skip is annotated); on any other run a missing token fails the
  # job, so it can never be a silent green.
  compose:
    name: compose
    runs-on: ubuntu-24.04
    env:
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      HAVE_TOKEN: ${{ secrets.ALBITOR_REPO_TOKEN != '' }}
    steps:
      - name: Skipped for a fork pull request
        if: env.IS_FORK == 'true'
        run: echo "::notice::compose skipped, fork pull requests get no ALBITOR_REPO_TOKEN; a maintainer must run scripts/compose-check.sh"
      - name: ALBITOR_REPO_TOKEN missing
        if: env.IS_FORK != 'true' && env.HAVE_TOKEN != 'true'
        run: |
          echo "::error::ALBITOR_REPO_TOKEN missing"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.IS_FORK != 'true' && env.HAVE_TOKEN == 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.IS_FORK != 'true' && env.HAVE_TOKEN == 'true'
        with:
          persist-credentials: false
          repository: albitor-ltd/albitor
          token: ${{ secrets.ALBITOR_REPO_TOKEN }}
          path: albitor
          sparse-checkout: app/core
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.IS_FORK != 'true'
        with:
          go-version: "1.27.3"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.IS_FORK != 'true'
        with:
          node-version: "24.22.1"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: env.IS_FORK != 'true'
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false
      - name: Compose, check, test and build, then run the journeys
        if: env.IS_FORK != 'true'
        env:
          PLAYWRIGHT_INSTALL_FLAGS: --with-deps
        run: scripts/compose-check.sh --build --journeys "$GITHUB_WORKSPACE/albitor"

  # The api-go plugin's own Go: its tree, composed with every slot empty, builds, vets and tests.
  api-go:
    name: api-go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Build, vet and test the composed API tree
        run: scripts/verify-api-go.sh

  # The data-dynamodb plugin's own Go, composed over api-go: build, vet, test, then the data-store@1
  # conformance suite against amazon/dynamodb-local (Docker is on the runner; the script starts and
  # removes the container).
  data-dynamodb:
    name: data-dynamodb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Build, vet and test the composed tree, then DynamoDB Local conformance
        run: scripts/verify-data-dynamodb.sh

  # The auth plugins' own Go, each composed over api-go with its own slots filled: build, vet and
  # test (the identity gate against a fake Cognito, and sign-in through api-go's local issuer).
  auth:
    name: auth (${{ matrix.plugin }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        plugin: [auth-cognito, auth-hosted, auth-none]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Build, vet and test the composed API tree
        run: scripts/verify-auth.sh "${{ matrix.plugin }}"

  # The deploy-byoa-aws plugin's Terraform: fmt, then each module's and the rendered root's tests
  # with the AWS provider mocked, so no account and no credential is involved.
  deploy-byoa-aws:
    name: deploy-byoa-aws
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false
      - name: Format, validate and test the modules and the rendered root
        run: scripts/verify-deploy-byoa-aws.sh
