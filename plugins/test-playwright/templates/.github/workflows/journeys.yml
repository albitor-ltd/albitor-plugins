# Managed by Albitor (test-playwright). Boots the app locally under the local run contract and
# runs the journey suite and the accessibility audit. Read-only: it reads no secret and writes
# nothing back to the repository.
name: journeys

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  journeys:
    name: journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Set up Go for the local API
        if: hashFiles('api/go.mod') != ''
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: api/go.mod
          cache: false
      - name: Install the app's web dependencies
        run: npm ci
        working-directory: web
      - name: Install the journey suite
        run: npm ci
        working-directory: web/tests
      - name: Install the browser (the unit tests drive it too)
        run: npx playwright install --with-deps chromium
        working-directory: web/tests
      - name: Unit-test the harness helpers
        run: npm run unit
        working-directory: web/tests
      - name: Run the journeys
        run: npm test
        working-directory: web/tests
        env:
          CI: "true"
      - name: Keep the report when a journey fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journey-report
          path: web/tests/playwright-report
          retention-days: 7
          if-no-files-found: ignore
