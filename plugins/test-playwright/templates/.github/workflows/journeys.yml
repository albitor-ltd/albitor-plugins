# Starting point (test-playwright). Boots the app locally under the local run contract and
# runs the journey suite and the accessibility audit. Read-only: it reads no secret and writes
# nothing back to the repository.
name: journeys

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  journeys:
    name: journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Set up Go for the local API
        if: hashFiles('api/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache: false
      - name: Install the app's web dependencies
        run: npm install
        working-directory: web
      - name: Install the journey suite
        run: npm ci
        working-directory: web/tests
      - name: Install the browser (the unit tests drive it too)
        run: npx playwright install --with-deps chromium
        working-directory: web/tests
      - name: Unit-test the harness helpers
        run: npm run unit
        working-directory: web/tests
      - name: Run the journeys
        run: npm test
        working-directory: web/tests
        env:
          CI: "true"
      - name: Keep the report when a journey fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-report
          path: web/tests/playwright-report
          retention-days: 7
          if-no-files-found: ignore
