# The API contract. The web client is generated from this file, so it is the one
# place an endpoint is described: add each route here in the same change as the handler.
openapi: 3.1.0
info:
  title: API
  version: 0.1.0
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness. Open to unauthenticated callers.
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /api/me:
    get:
      operationId: getMe
      summary: Who the session belongs to. Signed out, the answer is 401.
      responses:
        "200":
          description: The signed-in identity.
          content:
            application/json:
              schema:
                type: object
                required: [sub]
                properties:
                  sub: { type: string }
                  email: { type: string }
                  groups: { type: array, items: { type: string } }
        "401":
          description: No verified session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/config:
    get:
      operationId: getAuthConfig
      summary: How people get an account. Public; an app without AUTH_SIGN_UP answers open.
      responses:
        "200":
          description: The sign-up mode.
          content:
            application/json:
              schema:
                type: object
                required: [sign_up]
                properties:
                  sign_up: { type: string, enum: [open, invite_only] }
  /api/auth/change-password:
    post:
      operationId: changePassword
      summary: The signed-in person changes their own password. Both sign-up modes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "204": { description: The password was changed. }
        "400":
          description: The new password does not meet the pool's policy (invalid_password).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No verified session, or the current password is not right (invalid_credentials).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/delete:
    post:
      operationId: deleteAccount
      summary: The signed-in person deletes their own account, after confirming their password. Both sign-up modes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: The account is deleted; the same credentials no longer sign in. The cookies are cleared. }
        "401":
          description: No verified session, or the password is not right (invalid_credentials).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The last enabled user administrator of an invite-only app must make someone else one first (admin_account).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/users:
    get:
      operationId: listPeople
      x-admin-only: true
      summary: People with an account. Invite-only apps, administrators only; 404 in an open app.
      parameters:
        - { name: next, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Up to 60 people, and a token for the next page.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      required: [email, status, enabled, admin]
                      properties:
                        email: { type: string }
                        status: { type: string }
                        enabled: { type: boolean }
                        admin: { type: boolean }
                        created_at: { type: string, format: date-time }
                  next: { type: string }
        "403":
          description: Not an administrator (forbidden).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The app is not invite-only (not_found).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: invitePerson
      x-admin-only: true
      summary: Add a person with a generated temporary password. Nothing is emailed. Invite-only apps, administrators only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                admin: { type: boolean }
      responses:
        "201":
          description: The account exists. The temporary password is shown once and is never cached.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { type: object, required: [email, temporary_password], properties: { email: { type: string }, temporary_password: { type: string }, admin: { type: boolean } } }
        "403":
          description: Not an administrator (forbidden).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: An account with that email already exists (exists).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/users/disable:
    post:
      operationId: disablePerson
      x-admin-only: true
      summary: Disable a person's account. Invite-only apps, administrators only. You cannot disable yourself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "204": { description: The account is disabled. }
        "403":
          description: Not an administrator (forbidden).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/users/enable:
    post:
      operationId: enablePerson
      x-admin-only: true
      summary: Enable a disabled account. Invite-only apps, administrators only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "204": { description: The account is enabled. }
        "403":
          description: Not an administrator (forbidden).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/users/reset-password:
    post:
      operationId: resetPersonPassword
      x-admin-only: true
      summary: Give a person a new temporary password, shown once. Invite-only apps, administrators only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "200":
          description: The temporary password is shown once and is never cached.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { type: object, required: [email, temporary_password], properties: { email: { type: string }, temporary_password: { type: string }, admin: { type: boolean } } }
        "403":
          description: Not an administrator (forbidden).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: There is no one with that email address (not_found).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
# A list endpoint answers the Page envelope, never a bare array, takes `limit` and `cursor`, and
# is served with apikit.ServeList:
#
#   /api/widgets:
#     get:
#       operationId: listWidgets
#       parameters:
#         - $ref: "#/components/parameters/Limit"
#         - $ref: "#/components/parameters/Cursor"
#       responses:
#         "200":
#           description: One page of widgets.
#           content:
#             application/json:
#               schema:
#                 allOf:
#                   - $ref: "#/components/schemas/Page"
#                   - properties:
#                       items:
#                         items: { $ref: "#/components/schemas/Widget" }
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size, 1 to 100. Defaults to 20. Out of range is a 400, never clamped.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page. Opaque; never construct or decompose one.
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Page:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
        next_cursor:
          type: string
          description: Absent on the last page. Present means at least one more record.
