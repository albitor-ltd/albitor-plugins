# Managed by Albitor (deploy-byoa-aws). Builds and tests the app, applies the Terraform in
# infrastructure/aws against the AWS account this repository is bound to, ships the web bundle and
# waits for the CloudFront invalidation.
#
# The account is reached by OIDC: the job assumes the deploy role named in
# infrastructure/aws/env/<environment>.deploy.env, and no long-lived key is stored in the
# repository. The role's trust policy is pinned by the platform to this repository and to the
# environment the job runs in (`dev` unless a promotion names another), so the token this workflow
# mints can assume that one role and no other.
# `id-token: write` is held by the deploy job alone; the build job reads the repository and nothing
# else.
#
# The triggers are a push to main and a dispatch. Nothing triggered by a pull request, a fork or
# another workflow can reach the deploy job.
#
# The platform dispatches this workflow to promote a commit, and reads the result back (its
# deploy-receipt contract):
#   - the dispatch inputs `environment` and `ref` are declared (GitHub refuses undeclared ones);
#   - a job named exactly `ship SPA` runs only after a green apply and ends with a
#     `::notice title=deploy-receipt::{...}` step. The reader trusts that one job alone, so a run
#     that deployed nothing (no receipt) is never recorded as a deploy. Do not rename the job.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply into (its env/<name>.* files must exist)
        required: false
        default: dev
      ref:
        description: Exact commit to deploy. Empty deploys the default branch head.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # One deploy at a time, and a deploy already applying is never cancelled: a killed apply leaves
  # a state lock behind. A newer push waits its turn.
  # One deploy at a time per environment: a promotion applies a different state from a dev deploy.
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  build:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: hashFiles('api/go.mod') != ''
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: test the api
        if: hashFiles('api/go.mod') != ''
        run: go vet ./... && go test ./... -count=1
        working-directory: api
      - name: build the api for Lambda
        if: hashFiles('api/go.mod') != ''
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/api .
        working-directory: api
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('web/package.json') != ''
        with:
          node-version: "24.21.0"
      - name: install the web app
        if: hashFiles('web/package.json') != ''
        run: npm install
        working-directory: web
      - name: check and test the web app
        if: hashFiles('web/package.json') != ''
        run: npm run check && npm test
        working-directory: web
      - name: build the web app
        if: hashFiles('web/package.json') != ''
        run: npm run build
        working-directory: web
      - name: keep the api build
        if: hashFiles('api/go.mod') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-dist
          path: api/dist
          retention-days: 1
          if-no-files-found: error
      - name: keep the web build
        if: hashFiles('web/package.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: web/build
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: terraform apply and ship
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The deploy role's OIDC trust is scoped to the GitHub Environment of this name.
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      app_url: ${{ steps.app_url.outputs.app_url }}
      commit_sha: ${{ steps.app_url.outputs.commit_sha }}
      auth_user_pool_id: ${{ steps.app_url.outputs.auth_user_pool_id }}
      auth_client_id: ${{ steps.app_url.outputs.auth_client_id }}
      seed_status: ${{ steps.app_url.outputs.seed_status }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # First step, before the environment name is used to build any path. It matches the stack's
      # own rule (variables.tf); bash [[ =~ ]] anchors the whole value, so a newline cannot slip a
      # second line past the check.
      - name: check the environment name
        run: |
          set -euo pipefail
          if ! [[ "$ENVIRONMENT" =~ ^[a-z][a-z0-9]{1,8}$ ]]; then
            echo "::error::the environment must be 2 to 9 lower-case letters and digits, starting with a letter" >&2
            exit 1
          fi

      # A promotion pins `ref` to an older commit, which predates the env/<environment>.* files the
      # platform commits to the default branch just before it dispatches. So: code from the pinned
      # commit, per-environment configuration from the default branch head (github.sha of a
      # dispatch). The build job reads no env file, so only this job overlays.
      - name: take deploy inputs from the default branch
        if: ${{ inputs.ref != '' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: deploy-inputs-src
          sparse-checkout: infrastructure/aws/env
          persist-credentials: false
      - name: overlay deploy inputs
        if: ${{ inputs.ref != '' }}
        run: |
          set -euo pipefail
          if [ ! -d deploy-inputs-src/infrastructure/aws/env ]; then
            echo "::error::no infrastructure/aws/env directory on the default branch to overlay" >&2
            exit 1
          fi
          mkdir -p infrastructure/aws/env
          cp -f deploy-inputs-src/infrastructure/aws/env/* infrastructure/aws/env/
          rm -rf deploy-inputs-src

      # The platform writes these files when it binds the repository to an account. A deploy with
      # no identity fails here, loudly, rather than finishing green having deployed nothing.
      - name: resolve the deploy identity
        id: identity
        run: |
          set -euo pipefail
          cfg="infrastructure/aws/env/${ENVIRONMENT}.deploy.env"
          backend="infrastructure/aws/env/${ENVIRONMENT}.s3.tfbackend"
          if [ ! -f "$cfg" ] || [ ! -f "$backend" ]; then
            echo "::error::no deploy identity: $cfg and $backend are written when the repository is bound to an AWS account" >&2
            exit 1
          fi
          role="$(sed -n 's/^[[:space:]]*AWS_DEPLOY_ROLE_ARN[[:space:]]*=[[:space:]]*//p' "$cfg" | head -n1)"
          region="$(sed -n 's/^[[:space:]]*AWS_REGION[[:space:]]*=[[:space:]]*//p' "$cfg" | head -n1)"
          bucket="$(sed -n 's/^[[:space:]]*bucket[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$backend" | head -n1)"
          key="$(sed -n 's/^[[:space:]]*key[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$backend" | head -n1)"
          # Each value is a plain token before it reaches a later step.
          if ! printf '%s' "$role" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9_+=,.@/-]{1,128}$'; then
            echo "::error::AWS_DEPLOY_ROLE_ARN in $cfg is not a role ARN" >&2
            exit 1
          fi
          region="${region:-eu-west-2}"
          if ! printf '%s' "$region" | grep -Eq '^[a-z]{2}-[a-z]+-[0-9]$'; then
            echo "::error::AWS_REGION in $cfg is not a region" >&2
            exit 1
          fi
          if ! printf '%s' "$bucket" | grep -Eq '^[a-z0-9][a-z0-9.-]{2,62}$' || ! printf '%s' "$key" | grep -Eq '^[A-Za-z0-9/_.-]{1,512}$'; then
            echo "::error::bucket or key in $backend is not a plain value" >&2
            exit 1
          fi
          # Where the platform wrote this app's secrets (the app's slug). Optional here: only the
          # seed needs it, and it fails loudly when it is missing. A plain token or nothing.
          segment="$(sed -n 's/^[[:space:]]*ALBITOR_APP_SECRETS_SEGMENT[[:space:]]*=[[:space:]]*//p' "$cfg" | head -n1)"
          if [ -n "$segment" ] && ! printf '%s' "$segment" | grep -Eq '^[A-Za-z0-9._-]{1,100}$'; then
            echo "::error::ALBITOR_APP_SECRETS_SEGMENT in $cfg is not a plain token" >&2
            exit 1
          fi
          # The project name is the repository name, folded to what the stack accepts.
          project="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr 'A-Z_.' 'a-z--' | tr -cd 'a-z0-9-' | cut -c1-31)"
          {
            echo "role=$role"
            echo "region=$region"
            echo "bucket=$bucket"
            echo "key=$key"
            echo "project=$project"
            echo "secrets_segment=$segment"
          } >>"$GITHUB_OUTPUT"

      - name: fetch the api build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: hashFiles('api/go.mod') != ''
        with:
          name: api-dist
          path: api/dist
      - name: fetch the web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: hashFiles('web/package.json') != ''
        with:
          name: web-build
          path: web/build

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.identity.outputs.role }}
          aws-region: ${{ steps.identity.outputs.region }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infrastructure/aws

      # A lock left by a killed apply is cleared when it is stale and in this account's own state
      # bucket; a live one is waited out by -lock-timeout below.
      - name: clear a stale state lock
        env:
          STATE_BUCKET: ${{ steps.identity.outputs.bucket }}
          STATE_KEY: ${{ steps.identity.outputs.key }}
        run: bash ./scripts/tf-unlock-stale.sh "$STATE_BUCKET" "$STATE_KEY"

      - name: terraform init
        run: terraform init -input=false -lock-timeout=300s -backend-config="env/${ENVIRONMENT}.s3.tfbackend"
        working-directory: infrastructure/aws

      # The apply puts the new CSP live before the bundle ships, and the new build's inline bootstrap
      # hashes differ from the live shell's. The HTML the bucket serves now is copied out so the
      # stack hashes it too and admits both shells for this deploy: what is live, not what an
      # earlier plan expected. A first deploy has no bucket in the state and copies nothing; an
      # empty bucket copies nothing; a bucket that cannot be read stops here, before anything
      # changes, rather than blank the running site.
      - name: copy the live shell
        id: live_shell
        run: |
          set -euo pipefail
          bucket="$(terraform output -json | jq -r '.spa_bucket.value // ""')"
          if [ -z "$bucket" ]; then
            echo "no site bucket in the state yet; nothing live to admit"
            echo "dir=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$bucket" =~ ^[a-z0-9][a-z0-9.-]{2,62}$ ]]; then
            echo "::error::the state's spa_bucket is not a bucket name" >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/live-shell"
          rm -rf "$dir"
          mkdir -p "$dir"
          if ! aws s3 cp "s3://${bucket}" "$dir" --recursive --exclude '*' --include '*.html' --only-show-errors; then
            echo "::error::could not copy the live shell's HTML from s3://${bucket} (the deploy role needs s3:ListBucket and s3:GetObject on it)" >&2
            exit 1
          fi
          echo "dir=$dir" >>"$GITHUB_OUTPUT"
        working-directory: infrastructure/aws

      - name: terraform apply
        env:
          TF_VAR_project_name: ${{ steps.identity.outputs.project }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_aws_region: ${{ steps.identity.outputs.region }}
          TF_VAR_previous_web_build_dir: ${{ steps.live_shell.outputs.dir }}
        run: terraform apply -input=false -auto-approve -lock-timeout=300s
        working-directory: infrastructure/aws

      # The bundle ships straight after the apply, ahead of the seed: the window in which the new
      # policy fronts the old shell stays as short as it can be, and a seed that fails cannot leave
      # the stack applied with its bundle unshipped. Every output is read into a variable and
      # checked before it is used: a failed read inside `echo "$(...)"` would hand an empty value
      # on and read as success.
      - name: ship the web bundle
        run: |
          set -euo pipefail
          if [ ! -d web/build ]; then
            echo "no web bundle in this build; nothing to ship"
            exit 0
          fi
          cd infrastructure/aws
          bucket="$(terraform output -raw spa_bucket)"
          distribution="$(terraform output -raw cloudfront_distribution_id)"
          if ! printf '%s' "$bucket" | grep -Eq '^[a-z0-9][a-z0-9.-]{2,62}$' || ! printf '%s' "$distribution" | grep -Eq '^[A-Z0-9]{8,32}$'; then
            echo "::error::the stack has no site bucket or distribution to ship to" >&2
            exit 1
          fi
          cd ../..
          aws s3 sync web/build "s3://${bucket}" --delete
          invalidation="$(aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$distribution" --id "$invalidation"

      # The app's two platform accounts: the owner's demo account (so there is a way in on handover
      # day) and the platform's verifier (so its checks can sign in). Seeded into the pool the apply
      # just made, on the build target only (`dev`): a promotion to another
      # environment seeds nothing, because a known account with a password the platform holds would
      # be a standing credential on a place real users depend on. Each password is read from the
      # app's own secret store under this deploy identity; scripts/seed-platform-accounts.sh says
      # why this runs here and never in the function. An app with no user pool seeds nothing.
      - name: seed the platform accounts
        id: seed
        if: ${{ env.ENVIRONMENT == 'dev' }}
        env:
          SECRETS_SEGMENT: ${{ steps.identity.outputs.secrets_segment }}
        run: |
          set -euo pipefail
          pool="$(terraform -chdir=infrastructure/aws output -raw auth_user_pool_id)"
          bash ./scripts/seed-platform-accounts.sh "$pool" "$SECRETS_SEGMENT"

      # The receipt carries what the platform's sign-in check needs: the pool, the client and what
      # the seed did. Both ids are empty for an app with no sign-in.
      - name: print the app url
        id: app_url
        env:
          SEED_STATUS: ${{ steps.seed.outputs.seed_status }}
        run: |
          set -euo pipefail
          url="$(terraform output -raw app_url)"
          pool="$(terraform output -raw auth_user_pool_id)"
          client="$(terraform output -raw auth_client_id)"
          echo "$url"
          if [ -n "$pool" ] && ! printf '%s' "$pool" | grep -Eq '^[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]{1,32}$'; then
            echo "::error::auth_user_pool_id is not a user pool id" >&2
            exit 1
          fi
          if [ -n "$client" ] && ! printf '%s' "$client" | grep -Eq '^[A-Za-z0-9]{1,128}$'; then
            echo "::error::auth_client_id is not an app client id" >&2
            exit 1
          fi
          # The seed runs on dev alone, so a promotion has no status of its own; an app with no
          # pool says so either way.
          if [ -z "$SEED_STATUS" ] && [ -z "$pool" ]; then
            SEED_STATUS=no_pool
          fi
          if [ -n "$SEED_STATUS" ] && ! printf '%s' "$SEED_STATUS" | grep -Eq '^(seeded|no_pool|skipped_unprovisioned:(demo|verifier)(,(demo|verifier))?)$'; then
            echo "::error::the seed reported a status the receipt cannot carry" >&2
            exit 1
          fi
          if [ -z "$url" ]; then
            echo "::error::the stack applied but exposes no app_url (no site and no API), so there is nothing to report" >&2
            exit 1
          fi
          {
            echo "app_url=$url"
            echo "commit_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "auth_user_pool_id=$pool"
            echo "auth_client_id=$client"
            echo "seed_status=$SEED_STATUS"
          } >>"$GITHUB_OUTPUT"
        working-directory: infrastructure/aws

  # The platform reads the deploy receipt from this job and no other (core.DeployReceiptJobName).
  # It runs only after a green apply and ship, so its receipt is the evidence that something was
  # published. It holds no cloud identity.
  ship:
    name: ship SPA
    needs: [deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: stamp the deploy receipt
        env:
          APP_URL: ${{ needs.deploy.outputs.app_url }}
          DEPLOY_SHA: ${{ needs.deploy.outputs.commit_sha }}
          AUTH_USER_POOL_ID: ${{ needs.deploy.outputs.auth_user_pool_id }}
          AUTH_CLIENT_ID: ${{ needs.deploy.outputs.auth_client_id }}
          SEED_STATUS: ${{ needs.deploy.outputs.seed_status }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$APP_URL" | grep -Eq '^https://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+$'; then
            echo "::error::the stack has no https app url to report" >&2
            exit 1
          fi
          if ! printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::the deployed commit is not a full sha" >&2
            exit 1
          fi
          if [ -n "$AUTH_USER_POOL_ID" ] && ! printf '%s' "$AUTH_USER_POOL_ID" | grep -Eq '^[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]{1,32}$'; then
            echo "::error::the user pool id is not a pool id" >&2
            exit 1
          fi
          if [ -n "$AUTH_CLIENT_ID" ] && ! printf '%s' "$AUTH_CLIENT_ID" | grep -Eq '^[A-Za-z0-9]{1,128}$'; then
            echo "::error::the app client id is not a client id" >&2
            exit 1
          fi
          if [ -n "$SEED_STATUS" ] && ! printf '%s' "$SEED_STATUS" | grep -Eq '^(seeded|no_pool|skipped_unprovisioned:(demo|verifier)(,(demo|verifier))?)$'; then
            echo "::error::the seed status is not one the receipt carries" >&2
            exit 1
          fi
          printf '::notice title=deploy-receipt::{"url":"%s","commit_sha":"%s","auth_user_pool_id":"%s","auth_client_id":"%s","seed_status":"%s"}\n' \
            "$APP_URL" "$DEPLOY_SHA" "$AUTH_USER_POOL_ID" "$AUTH_CLIENT_ID" "$SEED_STATUS"
