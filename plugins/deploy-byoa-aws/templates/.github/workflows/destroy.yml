# Managed by Albitor (deploy-byoa-aws). Destroys one environment of the app: it empties the site
# bucket, lifts the deletion protection on the DynamoDB tables and the Cognito user pool, then runs
# `terraform destroy` against the state in infrastructure/aws. This is the "Delete app" path; it
# removes data and cannot be undone.
#
# The account is reached exactly as deploy.yml reaches it: the job assumes the deploy role named in
# infrastructure/aws/env/<environment>.deploy.env by OIDC, with no long-lived key in the repository.
# The role's trust policy is pinned by the platform to this repository and to the environment the
# job runs in. `id-token: write` is held by the destroy job alone.
#
# The only trigger is a manual dispatch from the default branch. Nothing triggered by a push, a pull
# request, a fork or another workflow can reach the destroy job. It shares deploy.yml's concurrency
# group, so it queues behind a deploy that is applying rather than cutting across it.
#
# The platform dispatches this workflow and reads the result back (its destroy-receipt contract):
#   - the dispatch inputs `environment` and `ref` are declared (GitHub refuses undeclared ones);
#   - a job named exactly `destroy receipt` runs only after a green destroy and ends with a
#     `::notice title=destroy-receipt::{"environment":..,"commit":..,"state":..}` step. The reader
#     trusts that one job alone, so a run that destroyed nothing (no receipt) is never recorded as
#     a deletion. Do not rename the job.
name: destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy (its env/<name>.* files must exist)
        required: true
      ref:
        description: Exact commit whose Terraform to destroy with. Empty uses the default branch head.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # The same group as deploy.yml: one change to an environment's state at a time, and a run already
  # applying or destroying is never cancelled, because a killed run leaves a state lock behind.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  destroy:
    name: terraform destroy
    # Only the default branch holds the deploy role's trust.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The deploy role's OIDC trust is scoped to the GitHub Environment of this name.
    environment: ${{ inputs.environment }}
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    permissions:
      contents: read
      id-token: write
    steps:
      # The default branch head (github.sha of a dispatch) with its history, so `ref` can be checked
      # against it below. No repository code or script runs before that check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # First step, before the environment name is used to build any path. It matches the stack's
      # own rule (variables.tf); bash [[ =~ ]] anchors the whole value, so a newline cannot slip a
      # second line past the check.
      - name: check the environment name
        run: |
          set -euo pipefail
          if ! [[ "$ENVIRONMENT" =~ ^[a-z][a-z0-9]{1,8}$ ]]; then
            echo "::error::the environment must be 2 to 9 lower-case letters and digits, starting with a letter" >&2
            exit 1
          fi

      # `ref` is empty or a full sha that is an ancestor of the default branch head: a destroy never
      # runs code from an unmerged branch or a fork. Passed through the environment, never spliced.
      - name: check the ref
        env:
          DESTROY_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "$DESTROY_REF" ]; then
            exit 0
          fi
          if ! [[ "$DESTROY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be empty or a full 40-character commit sha" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$DESTROY_REF" "$GITHUB_SHA"; then
            echo "::error::ref is not an ancestor of the default branch head" >&2
            exit 1
          fi
          # Code from the pinned commit, per-environment configuration from the default branch head,
          # because a pinned commit can predate the env/<environment>.* files the platform committed.
          git checkout --quiet --detach "$DESTROY_REF"
          git checkout --quiet "$GITHUB_SHA" -- infrastructure/aws/env

      - name: record the commit
        id: commit
        run: |
          set -euo pipefail
          sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::the checked-out commit is not a full sha" >&2
            exit 1
          fi
          echo "commit_sha=$sha" >>"$GITHUB_OUTPUT"

      - name: resolve the deploy identity
        id: identity
        run: |
          set -euo pipefail
          cfg="infrastructure/aws/env/${ENVIRONMENT}.deploy.env"
          backend="infrastructure/aws/env/${ENVIRONMENT}.s3.tfbackend"
          if [ ! -f "$cfg" ] || [ ! -f "$backend" ]; then
            echo "::error::no deploy identity: $cfg and $backend are written when the repository is bound to an AWS account" >&2
            exit 1
          fi
          role="$(sed -n 's/^[[:space:]]*AWS_DEPLOY_ROLE_ARN[[:space:]]*=[[:space:]]*//p' "$cfg" | head -n1)"
          region="$(sed -n 's/^[[:space:]]*AWS_REGION[[:space:]]*=[[:space:]]*//p' "$cfg" | head -n1)"
          bucket="$(sed -n 's/^[[:space:]]*bucket[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$backend" | head -n1)"
          key="$(sed -n 's/^[[:space:]]*key[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$backend" | head -n1)"
          if ! printf '%s' "$role" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9_+=,.@/-]{1,128}$'; then
            echo "::error::AWS_DEPLOY_ROLE_ARN in $cfg is not a role ARN" >&2
            exit 1
          fi
          region="${region:-eu-west-2}"
          if ! printf '%s' "$region" | grep -Eq '^[a-z]{2}-[a-z]+-[0-9]$'; then
            echo "::error::AWS_REGION in $cfg is not a region" >&2
            exit 1
          fi
          if ! printf '%s' "$bucket" | grep -Eq '^[a-z0-9][a-z0-9.-]{2,62}$' || ! printf '%s' "$key" | grep -Eq '^[A-Za-z0-9/_.-]{1,512}$'; then
            echo "::error::bucket or key in $backend is not a plain value" >&2
            exit 1
          fi
          # The project name is the repository name, folded to what the stack accepts.
          project="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr 'A-Z_.' 'a-z--' | tr -cd 'a-z0-9-' | cut -c1-31)"
          {
            echo "role=$role"
            echo "region=$region"
            echo "bucket=$bucket"
            echo "key=$key"
            echo "project=$project"
          } >>"$GITHUB_OUTPUT"

      # The stack reads the built bundle and the API binary while it is evaluated (the CSP hashes
      # and the Lambda archive), even to destroy. Nothing here is shipped, so empty stand-ins are
      # enough: they only have to exist. The handler name is read from albitor.yaml as a plain token.
      - name: stand in for the build outputs
        run: |
          set -euo pipefail
          mkdir -p web/build api/dist
          if [ ! -f web/build/index.html ]; then
            printf '<!doctype html><title>destroy</title>\n' >web/build/index.html
          fi
          handler="$(sed -n 's/^[[:space:]]*handler:[[:space:]]*"\{0,1\}\([A-Za-z0-9._-]\{1,64\}\)"\{0,1\}[[:space:]]*$/\1/p' albitor.yaml | head -n1)"
          handler="${handler:-api}"
          if [ ! -f "api/dist/$handler" ]; then
            : >"api/dist/$handler"
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.identity.outputs.role }}
          aws-region: ${{ steps.identity.outputs.region }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: clear a stale state lock
        env:
          STATE_BUCKET: ${{ steps.identity.outputs.bucket }}
          STATE_KEY: ${{ steps.identity.outputs.key }}
        run: bash ./scripts/tf-unlock-stale.sh "$STATE_BUCKET" "$STATE_KEY"

      - name: terraform init
        run: terraform init -input=false -lock-timeout=300s -backend-config="env/${ENVIRONMENT}.s3.tfbackend"
        working-directory: infrastructure/aws

      # Terraform cannot delete these on its own, and each is read from the state, so only what
      # this environment's stack made is touched:
      #   - the site bucket keeps every object version and delete marker (s3:ListBucketVersions,
      #     s3:DeleteObjectVersion), and a bucket with any left cannot be deleted;
      #   - each DynamoDB table has deletion protection on (dynamodb:UpdateTable);
      #   - the Cognito user pool has deletion protection on (cognito-idp:UpdateUserPool).
      # A thing the state does not hold is skipped, so a retry after a half-finished destroy passes.
      # Cognito's UpdateUserPool resets any setting it is not given, which is acceptable only
      # because the pool is deleted next.
      - name: unblock the deletes
        run: |
          set -euo pipefail
          # exists <what> <not-found pattern> <aws command...>: 0 when it is there, 1 when AWS says it
          # is not found, and a stop on any other error (AccessDenied, throttling), so a permission
          # gap is never mistaken for "already gone".
          exists() {
            local what="$1" gone="$2" err
            shift 2
            if err="$("$@" 2>&1 >/dev/null)"; then
              return 0
            fi
            if printf '%s' "$err" | grep -Eq "$gone"; then
              return 1
            fi
            echo "::error::could not check whether $what exists: $err" >&2
            exit 1
          }

          outputs="$(terraform output -json)"
          state="$(terraform show -json)"

          bucket="$(printf '%s' "$outputs" | jq -r '.spa_bucket.value // ""')"
          if [ -n "$bucket" ]; then
            if ! [[ "$bucket" =~ ^[a-z0-9][a-z0-9.-]{2,62}$ ]]; then
              echo "::error::the state's spa_bucket is not a bucket name" >&2
              exit 1
            fi
            if exists "s3://${bucket}" '404|Not Found|NoSuchBucket' aws s3api head-bucket --bucket "$bucket"; then
              echo "emptying s3://${bucket}"
              while :; do
                batch="$RUNNER_TEMP/delete-batch.json"
                listing="$(aws s3api list-object-versions --bucket "$bucket" --max-items 1000 --output json)"
                [ -n "$listing" ] || listing='{}'
                # --max-items may count versions only, so cap the batch at the API's 1000 keys here.
                printf '%s' "$listing" \
                  | jq -c '{Objects: ([(.Versions // [])[], (.DeleteMarkers // [])[]] | map({Key: .Key, VersionId: .VersionId}) | .[0:1000]), Quiet: true}' >"$batch"
                if [ "$(jq '(.Objects // []) | length' "$batch")" = 0 ]; then
                  break
                fi
                result="$(aws s3api delete-objects --bucket "$bucket" --delete "file://$batch" --output json)"
                first_error="$(printf '%s' "$result" | jq -r '(.Errors // [])[0] | if . then "\(.Key): \(.Code): \(.Message)" else "" end')"
                if [ -n "$first_error" ]; then
                  echo "::error::could not delete an object version: $first_error" >&2
                  exit 1
                fi
              done
            else
              echo "s3://${bucket} is already gone"
            fi
          fi

          tables="$(printf '%s' "$state" | jq -r '[.. | objects | select(.mode? == "managed" and .type? == "aws_dynamodb_table") | .values.name] | .[]')"
          for table in $tables; do
            if ! [[ "$table" =~ ^[A-Za-z0-9_.-]{3,255}$ ]]; then
              echo "::error::a table name in the state is not a plain name" >&2
              exit 1
            fi
            if exists "table $table" 'ResourceNotFoundException' aws dynamodb describe-table --table-name "$table"; then
              echo "lifting deletion protection on table $table"
              aws dynamodb update-table --table-name "$table" --no-deletion-protection-enabled >/dev/null
            fi
          done

          pool="$(printf '%s' "$outputs" | jq -r '.auth_user_pool_id.value // ""')"
          if [ -n "$pool" ]; then
            if ! [[ "$pool" =~ ^[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]{1,32}$ ]]; then
              echo "::error::the state's auth_user_pool_id is not a user pool id" >&2
              exit 1
            fi
            if exists "user pool $pool" 'ResourceNotFoundException' aws cognito-idp describe-user-pool --user-pool-id "$pool"; then
              echo "lifting deletion protection on user pool $pool"
              aws cognito-idp update-user-pool --user-pool-id "$pool" --deletion-protection INACTIVE
            fi
          fi
        working-directory: infrastructure/aws

      - name: terraform destroy
        env:
          TF_VAR_project_name: ${{ steps.identity.outputs.project }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_aws_region: ${{ steps.identity.outputs.region }}
        run: terraform destroy -input=false -auto-approve -lock-timeout=300s
        working-directory: infrastructure/aws

      # The receipt is evidence, not an assertion: the state must hold nothing once the destroy is
      # done.
      - name: check the state is empty
        run: |
          set -euo pipefail
          left="$(terraform state list)"
          if [ -n "$left" ]; then
            echo "::error::the destroy finished but the state still holds resources" >&2
            exit 1
          fi
        working-directory: infrastructure/aws

  # The platform reads the destroy receipt from this job and no other. It runs only after a green
  # destroy, so its receipt is the evidence that the environment is gone. It holds no cloud
  # identity.
  receipt:
    name: destroy receipt
    needs: [destroy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: stamp the destroy receipt
        env:
          DESTROY_COMMIT: ${{ needs.destroy.outputs.commit_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$ENVIRONMENT" =~ ^[a-z][a-z0-9]{1,8}$ ]]; then
            echo "::error::the environment is not one the receipt carries" >&2
            exit 1
          fi
          if ! printf '%s' "$DESTROY_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::the destroyed commit is not a full sha" >&2
            exit 1
          fi
          printf '::notice title=destroy-receipt::{"environment":"%s","commit":"%s","state":"destroyed"}\n' \
            "$ENVIRONMENT" "$DESTROY_COMMIT"
